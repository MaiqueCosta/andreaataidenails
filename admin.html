<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Andréa Nails</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <style>
    body { background:#fff0f6; }
    header { background:#ff69b4; color:#fff; padding:20px; text-align:center; }
    .btn-custom { background:#ff1493; color:#fff; }
  </style>

  <script>
    // 🔥 CONFIG COMPLETO (OBRIGATÓRIO)
    const firebaseConfig = {
      apiKey: "AIzaSyDb-xyAcfPGLlH0UfOYOFBCD8E__CaB8tk",
      authDomain: "andrenailsdesign.firebaseapp.com",
      projectId: "andrenailsdesign",
      storageBucket: "andrenailsdesign.firebasestorage.app",
      messagingSenderId: "527220434204",
      appId: "1:527220434204:web:cf5f71320a4d98de6646d9"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
  </script>
</head>

<body>

<header>
  <h1>Painel Admin</h1>
</header>

<div class="container mt-4">

  <!-- LOGIN -->
  <div id="loginContainer">
    <h3>Login</h3>
    <form id="loginForm">
      <input type="email" id="email" class="form-control mb-2" placeholder="Email" required>
      <input type="password" id="senha" class="form-control mb-2" placeholder="Senha" required>
      <button class="btn btn-custom">Entrar</button>
    </form>

    <hr>
    <button id="loginGoogle" class="btn btn-custom">Entrar com Google</button>
  </div>

  <!-- ADMIN -->
  <div id="adminContent" style="display:none;">

    <h3>Controle de Agenda</h3>

    <div class="row mb-3">
      <div class="col-md-3">
        <input type="date" id="dataAgenda" class="form-control">
      </div>
      <div class="col-md-6">
        <input type="text" id="horariosAgenda" class="form-control" placeholder="09:00,10:00,14:00">
      </div>
      <div class="col-md-3">
        <button id="salvarAgenda" class="btn btn-custom w-100">Salvar</button>
      </div>
    </div>

    <h3>Serviços</h3>

    <div class="row mb-3">
      <div class="col-md-5">
        <input id="nomeServico" class="form-control" placeholder="Nome">
      </div>
      <div class="col-md-3">
        <input id="valorServico" class="form-control" placeholder="Valor">
      </div>
      <div class="col-md-2">
        <button id="salvarServico" class="btn btn-custom w-100">Salvar</button>
      </div>
    </div>

    <table class="table table-bordered">
      <thead>
        <tr>
          <th>Serviço</th>
          <th>Valor</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tabelaServicos"></tbody>
    </table>

    <h3>Agendamentos</h3>

    <table class="table table-bordered">
      <thead>
        <tr>
          <th>Cliente</th>
          <th>Data</th>
          <th>Horário</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="agendamentosTable"></tbody>
    </table>

    <button id="logoutBtn" class="btn btn-danger">Sair</button>

  </div>

</div>

<script>
$(document).ready(function() {

  function entrarAdmin(){
    $('#loginContainer').hide();
    $('#adminContent').show();
    listarAgendamentos();
    listarServicos();
  }

  // 🔥 CONTROLE DE SESSÃO (ESSENCIAL)
  auth.onAuthStateChanged(function(user) {
    if (user) {
      entrarAdmin();
    } else {
      $('#loginContainer').show();
      $('#adminContent').hide();
    }
  });

  // LOGIN EMAIL
  $('#loginForm').submit(function(e){
    e.preventDefault();

    auth.signInWithEmailAndPassword(
      $('#email').val(),
      $('#senha').val()
    ).catch(e => alert(e.message));
  });

  // LOGIN GOOGLE (COM FALLBACK)
  $('#loginGoogle').click(async ()=>{
    const provider = new firebase.auth.GoogleAuthProvider();

    try {
      await auth.signInWithPopup(provider);
    } catch (e) {
      console.error(e);
      await auth.signInWithRedirect(provider);
    }
  });

  $('#logoutBtn').click(()=>{
    auth.signOut();
  });

  // AGENDA
  $('#salvarAgenda').click(async ()=>{
    const data = $('#dataAgenda').val();
    const horarios = $('#horariosAgenda').val().split(',');

    await db.collection('agenda').doc(data).set({
      data,
      horarios,
      bloqueados:[]
    });

    alert('Agenda salva');
  });

  // SERVIÇOS
  async function listarServicos(){
    const tabela = $('#tabelaServicos');
    tabela.empty();

    const snap = await db.collection('servicos').get();

    snap.forEach(doc=>{
      const s = doc.data();

      tabela.append(`
        <tr>
          <td>${s.nome}</td>
          <td>${s.valor}</td>
          <td>${s.ativo ? 'Ativo' : 'Inativo'}</td>
          <td>
            <button onclick="toggleServico('${doc.id}', ${s.ativo})">🔄</button>
            <button onclick="excluirServico('${doc.id}')">🗑</button>
          </td>
        </tr>
      `);
    });
  }

  $('#salvarServico').click(async ()=>{
    await db.collection('servicos').add({
      nome: $('#nomeServico').val(),
      valor: $('#valorServico').val(),
      ativo: true
    });

    listarServicos();
  });

  window.toggleServico = async (id, ativo)=>{
    await db.collection('servicos').doc(id).update({ativo: !ativo});
    listarServicos();
  }

  window.excluirServico = async (id)=>{
    await db.collection('servicos').doc(id).delete();
    listarServicos();
  }

  // AGENDAMENTOS
  async function listarAgendamentos(){
    const tabela = $('#agendamentosTable');
    tabela.empty();

    const snap = await db.collection('agendamentos').get();

    snap.forEach(doc=>{
      const a = doc.data();

      tabela.append(`
        <tr>
          <td>${a.nome}</td>
          <td>${a.data}</td>
          <td>${a.horario}</td>
          <td>${a.status}</td>
          <td>
            <button onclick="status('${doc.id}','confirmado')">✔</button>
            <button onclick="status('${doc.id}','cancelado')">✖</button>
          </td>
        </tr>
      `);
    });
  }

  window.status = async (id, status)=>{
    await db.collection('agendamentos').doc(id).update({status});
    listarAgendamentos();
  }

});
</script>

</body>
</html>
