<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Andréa Nails - Agendamento</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/inputmask/5.0.8/jquery.inputmask.min.js"></script>

  <style>
    body { font-family: Arial, sans-serif; background-color: #fff0f6; }
    header { background-color: #ff69b4; color: white; padding: 20px 0; text-align: center; position: relative; }
    .container { margin-top: 30px; }
    .form-label { font-weight: bold; }
    footer { text-align: center; padding: 20px; background-color: #ff69b4; color: white; margin-top: 40px; }
    .btn-custom { background-color: #ff1493; color: white; border: none; }
    .btn-custom:hover { background-color: #ff3399; }
    a { color: white; text-decoration: underline; }
    .btn-admin { position: absolute; top: 10px; right: 10px; }
  </style>

  <!-- 🔥 Firebase V8 (CORRETO) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDb-xyAcfPGLlH0UfOYOFBCD8E__CaB8tk",
      authDomain: "andrenailsdesign.firebaseapp.com",
      projectId: "andrenailsdesign",
      storageBucket: "andrenailsdesign.firebasestorage.app",
      messagingSenderId: "527220434204",
      appId: "1:527220434204:web:cf5f71320a4d98de6646d9"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
  </script>
</head>

<body>
  <header>
    <h1>Andréa Nails</h1>
    <p>Manicure profissional com agendamento online</p>

    <a href="admin.html" class="btn btn-dark btn-sm btn-admin">Painel Admin</a>
  </header>

  <div class="container">
    <h2>Agende seu horário</h2>

    <form id="formAgendamento" action="https://formsubmit.co/andreataidenails@gmail.com" method="POST">

      <div class="mb-3">
        <label class="form-label">Nome</label>
        <input type="text" class="form-control" id="nome" required />
      </div>

      <div class="mb-3">
        <label class="form-label">Telefone</label>
        <input type="tel" class="form-control" id="telefone" required />
      </div>

      <div class="mb-3">
        <label class="form-label">Serviço</label>
        <select class="form-select" id="servico" required>
          <option>Carregando serviços...</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Data</label>
        <input type="date" class="form-control" id="data" required />
      </div>

      <div class="mb-3">
        <label class="form-label">Horário</label>
        <select class="form-select" id="horario" required>
          <option value="">Selecione</option>
        </select>
      </div>

      <button type="submit" class="btn btn-custom">Enviar Agendamento</button>

      <input type="hidden" name="_captcha" value="false" />
      <input type="hidden" name="_next" value="https://andreaataidenails.com.br/obrigado.html" />
    </form>
  </div>

  <footer>
    <p>
      📍 Terça a Sábado, 08h às 17h<br>
      📞 <a href="https://wa.me/5571993467611" target="_blank">WhatsApp</a>
    </p>
  </footer>

<script>
$(document).ready(function () {

  const horariosPossiveis = ["09:00","10:00","11:00","13:00","14:00","15:00","16:00","17:00"];

  // 🔥 CARREGAR SERVIÇOS DINÂMICOS
  async function carregarServicos() {
    const select = $('#servico');
    select.empty().append('<option>Carregando...</option>');

    try {
      const snapshot = await db.collection('servicos')
        .where('ativo', '==', true)
        .get();

      select.empty().append('<option value="">Selecione</option>');

      snapshot.forEach(doc => {
        const s = doc.data();
        select.append(`<option value="${s.nome} - R$ ${s.valor}">
          ${s.nome} - R$ ${s.valor}
        </option>`);
      });

    } catch (e) {
      console.error(e);
      select.html('<option>Erro ao carregar</option>');
    }
  }

  carregarServicos();

  // Máscara telefone
  $('#telefone').inputmask({
    mask: '(99) 99999-9999'
  });

  // Horários
  $('#data').on('change', async function () {
    const dataSelecionada = $(this).val();
    $('#horario').empty().append('<option>Carregando...</option>');

    const snapshot = await db.collection('agendamentos')
      .where('data', '==', dataSelecionada)
      .get();

    const ocupados = snapshot.docs.map(doc => doc.data().horario);
    const livres = horariosPossiveis.filter(h => !ocupados.includes(h));

    $('#horario').empty();

    if (livres.length === 0) {
      $('#horario').append('<option>Sem horários</option>');
      return;
    }

    $('#horario').append('<option value="">Selecione</option>');

    livres.forEach(h => {
      $('#horario').append(`<option value="${h}">${h}</option>`);
    });
  });

  // Envio
  $('#formAgendamento').on('submit', async function (e) {
    e.preventDefault();

    const nome = $('#nome').val();
    const telefone = $('#telefone').val();
    const servico = $('#servico').val();
    const data = $('#data').val();
    const horario = $('#horario').val();

    const check = await db.collection('agendamentos')
      .where('data', '==', data)
      .where('horario', '==', horario)
      .get();

    if (!check.empty) {
      alert('Horário já ocupado');
      return;
    }

    await db.collection('agendamentos').add({
      nome, telefone, servico, data, horario,
      status: "agendado",
      criadoEm: firebase.firestore.FieldValue.serverTimestamp()
    });

    alert('Agendado com sucesso!');
    this.reset();
  });

});
</script>

</body>
</html>
