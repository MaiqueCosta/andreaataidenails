<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Andréa Nails - Agendamento</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />

  <!-- jQuery -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>

  <!-- ✅ Inputmask CORRETO -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/inputmask/5.0.8/jquery.inputmask.min.js"></script>

  <style>
    body { font-family: Arial; background-color: #fff0f6; }
    header { background-color: #ff69b4; color: white; padding: 20px; text-align: center; position: relative; }
    .container { margin-top: 30px; }
    footer { text-align: center; padding: 20px; background-color: #ff69b4; color: white; margin-top: 40px; }
    .btn-custom { background-color: #ff1493; color: white; }
    .btn-admin { position: absolute; top: 10px; right: 10px; }
  </style>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDb-xyAcfPGLlH0UfOYOFBCD8E__CaB8tk",
      authDomain: "andrenailsdesign.firebaseapp.com",
      projectId: "andrenailsdesign",
      storageBucket: "andrenailsdesign.firebasestorage.app",
      messagingSenderId: "527220434204",
      appId: "1:527220434204:web:cf5f71320a4d98de6646d9"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
  </script>
</head>

<body>

<header>
  <h1>Andréa Nails</h1>
  <p>Agendamento online</p>
  <a href="admin.html" class="btn btn-dark btn-sm btn-admin">Admin</a>
</header>

<div class="container">
  <h2>Agende seu horário</h2>

  <form id="formAgendamento">

    <input class="form-control mb-2" id="nome" placeholder="Nome" required>

    <input 
      class="form-control mb-2" 
      id="telefone" 
      placeholder="(99) 99999-9999"
      required
    >

    <select class="form-control mb-2" id="servico" required>
      <option value="">Carregando serviços...</option>
    </select>

    <input type="date" class="form-control mb-2" id="data" required>

    <select class="form-control mb-2" id="horario" required>
      <option value="">Selecione</option>
    </select>

    <button class="btn btn-custom w-100">Agendar</button>

  </form>
</div>

<footer>
  <p>Terça a Sábado - 08h às 17h</p>
</footer>

<script>
$(document).ready(function () {

  // ✅ TELEFONE FUNCIONANDO
  $('#telefone').inputmask('(99) 99999-9999');

  // =========================
  // 🔥 CARREGAR SERVIÇOS
  // =========================
  async function carregarServicos() {
    const select = $('#servico');

    try {
      const snapshot = await db.collection('servicos')
        .where('ativo', '==', true)
        .get();

      select.empty().append('<option value="">Selecione</option>');

      if (snapshot.empty) {
        select.append('<option value="">Nenhum serviço disponível</option>');
        return;
      }

      snapshot.forEach(doc => {
        const s = doc.data();

        select.append(
          `<option value="${s.nome} - R$ ${s.valor}">
            ${s.nome} - R$ ${s.valor}
          </option>`
        );
      });

    } catch (e) {
      console.error("Erro ao carregar serviços:", e);
      select.html('<option>Erro ao carregar serviços</option>');
    }
  }

  // =========================
  // 🔥 CARREGAR HORÁRIOS
  // =========================
  $('#data').on('change', async function () {
    const data = $(this).val();
    const select = $('#horario');

    select.html('<option>Carregando...</option>');

    if (!data) return;

    try {
      const agendaDoc = await db.collection('agenda').doc(data).get();

      if (!agendaDoc.exists) {
        select.html('<option>Sem horários</option>');
        return;
      }

      const agenda = agendaDoc.data();

      const snapshot = await db.collection('agendamentos')
        .where('data', '==', data)
        .get();

      const ocupados = snapshot.docs.map(doc => doc.data().horario);

      const livres = (agenda.horarios || []).filter(h =>
        !(agenda.bloqueados || []).includes(h) &&
        !ocupados.includes(h)
      );

      select.empty();

      if (livres.length === 0) {
        select.append('<option>Sem horários disponíveis</option>');
        return;
      }

      select.append('<option value="">Selecione</option>');

      livres.forEach(h => {
        select.append(`<option value="${h}">${h}</option>`);
      });

    } catch (e) {
      console.error("Erro ao carregar horários:", e);
      select.html('<option>Erro ao carregar horários</option>');
    }
  });

  // =========================
  // 🚀 AGENDAR
  // =========================
  $('#formAgendamento').on('submit', async function (e) {
    e.preventDefault();

    const nome = $('#nome').val();
    const telefone = $('#telefone').val();
    const servico = $('#servico').val();
    const data = $('#data').val();
    const horario = $('#horario').val();

    if (!nome || !telefone || !servico || !data || !horario) {
      alert('Preencha tudo');
      return;
    }

    const check = await db.collection('agendamentos')
      .where('data', '==', data)
      .where('horario', '==', horario)
      .get();

    if (!check.empty) {
      alert('Horário já ocupado');
      return;
    }

    await db.collection('agendamentos').add({
      nome,
      telefone,
      servico,
      data,
      horario,
      status: "agendado",
      criadoEm: firebase.firestore.FieldValue.serverTimestamp()
    });

    alert('Agendamento realizado!');
    this.reset();
    $('#horario').html('<option value="">Selecione</option>');
  });

  // 🔥 INICIAR
  carregarServicos();

});
</script>

</body>
</html>
